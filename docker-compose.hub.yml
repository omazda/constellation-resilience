# Запуск ГОТОВОГО образа из реестра — без исходников и без сборки.
#
#   CONSTELLATION_IMAGE=<логин>/constellation:latest \
#     docker compose -f docker-compose.hub.yml up -d
#
# Нужно ровно два: установленный docker и этот файл. Собранный фронтенд, расчётное ядро,
# сэмплы сценариев, шрифты и текстуры глобуса лежат внутри образа — интернет после
# скачивания не требуется.
services:
  app:
    image: ${CONSTELLATION_IMAGE:?укажите образ, например omazda/constellation:latest}
    ports:
      - "${CONSTELLATION_PORT:-8000}:8000"
    restart: unless-stopped
    volumes:
      - constellation-data:/app/data

volumes:
  constellation-data:
