<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="980" height="620" fill="#f8fafc"/>
  <text x="490" y="30" text-anchor="middle" font-size="18" font-weight="600" fill="#0f172a">Проектирование устойчивой спутниковой группировки — архитектура сервиса</text>

  <!-- Браузер -->
  <g>
    <rect x="30" y="60" width="260" height="150" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="160" y="84" text-anchor="middle" font-size="14" font-weight="600" fill="#075985">Браузер (Nuxt 4 SPA)</text>
    <text x="45" y="108" font-size="12" fill="#0c4a6e">layouts/default.vue — загрузка сценария</text>
    <text x="45" y="128" font-size="12" fill="#0c4a6e">GlobeView.vue — глобус, globe.gl</text>
    <text x="45" y="148" font-size="12" fill="#0c4a6e">TimelineBar.vue — шкала отсчётов</text>
    <text x="45" y="168" font-size="12" fill="#0c4a6e">AvailabilityChart / CompareView.vue</text>
    <text x="45" y="192" font-size="12" fill="#0c4a6e">composables/useWs.ts, useScenario.ts</text>
  </g>

  <!-- WS стрелка -->
  <line x1="290" y1="130" x2="380" y2="130" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="335" y="118" text-anchor="middle" font-size="11" fill="#334155">/ws</text>
  <line x1="380" y1="150" x2="290" y2="150" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="335" y="168" text-anchor="middle" font-size="10" fill="#334155">JSON + бинарный фрейм</text>

  <!-- Веб-слой -->
  <g>
    <rect x="380" y="60" width="250" height="150" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="505" y="84" text-anchor="middle" font-size="14" font-weight="600" fill="#78350f">backend/app — веб-слой</text>
    <text x="395" y="108" font-size="12" fill="#78350f">ws.py — конверт {id,type,payload}</text>
    <text x="395" y="128" font-size="12" fill="#78350f">protocol.py — парсинг, коды ошибок,</text>
    <text x="395" y="146" font-size="12" fill="#78350f">  бинарная упаковка pack_sections()</text>
    <text x="395" y="166" font-size="12" fill="#78350f">main.py — /health, /samples, статика</text>
    <text x="395" y="186" font-size="12" fill="#78350f">кеш расчёта: (variant_id, strategy)</text>
  </g>

  <!-- REST снизу к статике -->
  <rect x="380" y="230" width="250" height="46" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="505" y="258" text-anchor="middle" font-size="12" fill="#334155">GET /health · /samples · статика ./static (nuxt generate)</text>
  <line x1="160" y1="210" x2="160" y2="230" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="160" y1="230" x2="380" y2="253" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- Стрелка веб-слой -> core -->
  <line x1="505" y1="210" x2="505" y2="300" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="600" y="255" font-size="11" fill="#334155">вызовы функций,</text>
  <text x="600" y="270" font-size="11" fill="#334155">без импортов обратно</text>

  <!-- Расчётное ядро -->
  <g>
    <rect x="290" y="300" width="430" height="200" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="505" y="324" text-anchor="middle" font-size="14" font-weight="600" fill="#14532d">backend/core — расчётное ядро (без импортов из app/)</text>

    <rect x="308" y="340" width="180" height="42" rx="6" fill="#ffffff" stroke="#16a34a"/>
    <text x="398" y="358" text-anchor="middle" font-size="11.5" fill="#14532d">scenario.py</text>
    <text x="398" y="374" text-anchor="middle" font-size="10" fill="#166534">валидация, patch, экспорт, хеш</text>

    <rect x="500" y="340" width="200" height="42" rx="6" fill="#ffffff" stroke="#16a34a"/>
    <text x="600" y="358" text-anchor="middle" font-size="11.5" fill="#14532d">network.py</text>
    <text x="600" y="374" text-anchor="middle" font-size="10" fill="#166534">snapshot(), граф связности adj</text>

    <rect x="308" y="392" width="180" height="42" rx="6" fill="#ffffff" stroke="#16a34a"/>
    <text x="398" y="410" text-anchor="middle" font-size="11.5" fill="#14532d">routing.py</text>
    <text x="398" y="426" text-anchor="middle" font-size="10" fill="#166534">find_route, no_route_reason</text>

    <rect x="500" y="392" width="200" height="42" rx="6" fill="#ffffff" stroke="#16a34a"/>
    <text x="600" y="410" text-anchor="middle" font-size="11.5" fill="#14532d">metrics.py</text>
    <text x="600" y="426" text-anchor="middle" font-size="10" fill="#166534">compute() — источник истины,</text>
    <text x="600" y="440" text-anchor="middle" font-size="10" fill="#166534">disjoint_paths, critical_satellites</text>

    <rect x="308" y="444" width="180" height="42" rx="6" fill="#ffffff" stroke="#16a34a"/>
    <text x="398" y="462" text-anchor="middle" font-size="11.5" fill="#14532d">delivery.py</text>
    <text x="398" y="478" text-anchor="middle" font-size="10" fill="#166534">доставляемость с допуском по T</text>

    <rect x="500" y="444" width="200" height="42" rx="6" fill="#fff7ed" stroke="#c2410c"/>
    <text x="600" y="462" text-anchor="middle" font-size="11.5" fill="#7c2d12">geometry.py (эталон)</text>
    <text x="600" y="478" text-anchor="middle" font-size="10" fill="#9a3412">не трогаем — копия ТЗ</text>
  </g>

  <!-- tools/golden.py справа -->
  <g>
    <rect x="760" y="340" width="190" height="96" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
    <text x="855" y="364" text-anchor="middle" font-size="13" font-weight="600" fill="#7f1d1d">tools/golden.py</text>
    <text x="775" y="386" font-size="10.5" fill="#7f1d1d">независимый эталон:</text>
    <text x="775" y="402" font-size="10.5" fill="#7f1d1d">своя geometry.snapshot()+BFS,</text>
    <text x="775" y="418" font-size="10.5" fill="#7f1d1d">сверяет core/ и выгрузку --result</text>
  </g>
  <line x1="720" y1="390" x2="760" y2="390" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <!-- Данные -->
  <g>
    <rect x="30" y="330" width="220" height="90" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4"/>
    <text x="140" y="354" text-anchor="middle" font-size="13" font-weight="600" fill="#4c1d95">Данные/*.json</text>
    <text x="45" y="376" font-size="10.5" fill="#4c1d95">cosmo-A-1.0 — сценарии,</text>
    <text x="45" y="392" font-size="10.5" fill="#4c1d95">в образе копируются в ./samples</text>
  </g>
  <line x1="140" y1="330" x2="290" y2="345" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- Выгрузка -->
  <g>
    <rect x="30" y="470" width="220" height="90" rx="10" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.4"/>
    <text x="140" y="494" text-anchor="middle" font-size="13" font-weight="600" fill="#312e81">выгрузка результата</text>
    <text x="45" y="516" font-size="10.5" fill="#312e81">cosmo-A-result-1.0:</text>
    <text x="45" y="532" font-size="10.5" fill="#312e81">effective_scenario + routes</text>
    <text x="45" y="548" font-size="10.5" fill="#312e81">(export, kind="result")</text>
  </g>
  <line x1="290" y1="470" x2="150" y2="470" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arrow)"/>

  <text x="490" y="600" text-anchor="middle" font-size="11" fill="#64748b">Один процесс, один порт 8000: FastAPI отдаёт и /ws, и статику Nuxt (docker-compose.yml) — docs/ARCHITECTURE.md</text>
</svg>
